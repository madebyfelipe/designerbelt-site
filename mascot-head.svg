<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" class="db-head" aria-hidden="true" focusable="false">
<!-- Designer's Belt mascot, head only, motion v2 (minimal). Silhouette from the brand cat; no body, mouth or muzzle. -->
<g class="dbh-root">
  <g class="dbh-look">
    <g class="dbh-float">
      <g class="dbh-ear-l-look"><g class="dbh-ear dbh-ear-l">
        <path d="M76 230 C72 155 88 95 110 52 L192 132 Z" fill="#0B0C0C" stroke="#F3F2EF" stroke-width="9" stroke-linejoin="round"/>
        <path d="M96 180 C96 140 104 110 114 88 L158 130 Z" fill="#232626"/>
      </g></g>
      <g class="dbh-ear-r-look"><g class="dbh-ear dbh-ear-r">
        <path d="M324 230 C328 155 312 95 290 52 L208 132 Z" fill="#0B0C0C" stroke="#F3F2EF" stroke-width="9" stroke-linejoin="round"/>
        <path d="M304 180 C304 140 296 110 286 88 L242 130 Z" fill="#232626"/>
      </g></g>
      <path class="dbh-skull" d="M70 280 C65 195 105 130 200 130 C295 130 335 195 330 280 C330 350 270 385 200 385 C130 385 70 350 70 280 Z" fill="#0B0C0C" stroke="#F3F2EF" stroke-width="9" stroke-linejoin="round"/>
      <g class="dbh-face">
        <g class="dbh-eyes">
          <g class="dbh-eye-tilt dbh-eye-tilt-l"><rect class="dbh-eye dbh-eye-l" x="117" y="244" width="64" height="26" rx="13" fill="#F3F2EF"/></g>
          <g class="dbh-eye-tilt dbh-eye-tilt-r"><rect class="dbh-eye dbh-eye-r" x="219" y="244" width="64" height="26" rx="13" fill="#F3F2EF"/></g>
          <g class="dbh-happy" fill="none" stroke="#F3F2EF" stroke-width="10" stroke-linecap="round">
            <path d="M125 268 Q149 238 173 268"/><path d="M227 268 Q251 238 275 268"/>
          </g>
        </g>
        <path class="dbh-nose" d="M190 304 L210 304 L200 316 Z" fill="#F3F2EF"/>
      </g>
    </g>
  </g>
</g>
</svg>
